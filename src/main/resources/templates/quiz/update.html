<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>퀴즈 수정</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header fw-bold">
            퀴즈 수정
        </div>

        <div class="card-body">

            <form
                    onsubmit="return validForm()"
                    action="/quiz/update"
                    method="post"
                    th:object="${dto}"
            >

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">
                        퀴즈 내용
                    </label>

                    <textarea th:field="*{content}" rows="5" class="form-control">
                    </textarea>
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        퀴즈 정답
                    </label>

                    <div class="form-check form-check-inline">

                        <input th:field="*{answer}"
                               class="form-check-input"
                               type="radio" value="true"
                               id="answerTrue"
                        >

                        <label for="answerTrue" class="form-check-label">
                            O
                        </label>

                    </div>

                    <div class="form-check form-check-inline">

                        <input th:field="*{answer}"
                               class="form-check-input"
                               type="radio" value="false"
                               id="answerFalse"
                        >

                        <label for="answerFalse" class="form-check-label">
                            X
                        </label>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        작성자
                    </label>

                    <input
                            type="text" th:field="*{writer}" class="form-control">

                </div>

                <button
                        type="submit"
                        class="btn btn-primary">
                    수정하기
                </button>

                <a
                        href="/quiz"
                        class="btn btn-secondary">
                    돌아가기
                </a>

            </form>

        </div>
    </div>

</div>
<script>
    function validForm() {
        const content = document.getElementById("content");
        const writer = document.getElementById("writer");

        //  trim()을 사용하여 앞뒤 공백을 제거한 후 빈 문자열인지
        if (content.value.trim() === ''){
            alert('공백만 입력하거나 빈 칸일 수 없습니다.')
            content.focus();
            return false; // 제출 막기
        }

        if(writer.value.trim() === ''){
            alert('공백만 입력하거나 빈 칸일 수 없습니다.')
            content.focus();
            return false; // 제출 막기
        }

        return true; // 제출 허용
    }
</script>
</body>
</html>
